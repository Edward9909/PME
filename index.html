<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PME — Plataforma operativa (maqueta)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --paper: #F1EDE3;
            --ink: #2B2B28;
            --ink-soft: #5C5A52;
            --blueprint: #2C5F74;
            --blueprint-light: #E4EEF0;
            --oxide: #B5502D;
            --oxide-light: #F7E6DE;
            --olive: #5C6B3E;
            --olive-light: #E8ECDC;
            --plum: #6B4A6B;
            --plum-light: #EFE3EC;
            --amber: #9C7A1F;
            --amber-light: #F5EAD3;
            --teal: #1F7A6C;
            --teal-light: #DCEFEB;
            --indigo: #4C4A8C;
            --indigo-light: #E4E3F2;
            --steel: #6E6B62;
            --steel-light: #EAE8E1;
            --line: #D8D3C4;
            --card: #FFFFFF;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: 'IBM Plex Sans', sans-serif;
            padding: 20px 16px 60px;
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 14px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .head h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 22px;
            margin: 0;
        }

        .head .meta {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--ink-soft);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .mock-flag {
            display: inline-block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: var(--amber-light);
            color: var(--amber);
            padding: 2px 8px;
            margin-left: 8px;
            vertical-align: middle;
        }

        /* ---------- role switcher ---------- */
        .role-bar {
            margin-bottom: 16px;
        }

        .role-bar .section-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ink-soft);
            margin: 0 0 8px;
        }

        .role-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .role-chip {
            flex: 0 0 auto;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink-soft);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11.5px;
            padding: 7px 12px;
            cursor: pointer;
            white-space: nowrap;
            border-top: 3px solid var(--steel);
        }

        .role-chip.admin { border-top-color: var(--ink); }
        .role-chip.area-produccion { border-top-color: var(--oxide); }
        .role-chip.area-diseno { border-top-color: var(--blueprint); }
        .role-chip.area-gestion { border-top-color: var(--plum); }
        .role-chip.area-montaje { border-top-color: var(--olive); }

        .role-chip.active {
            border-color: var(--ink);
            box-shadow: inset 0 0 0 1px var(--ink);
            color: var(--ink);
            font-weight: 500;
        }

        .preview-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--blueprint-light);
            border: 1px solid var(--blueprint);
            color: var(--blueprint);
            padding: 10px 14px;
            margin-bottom: 18px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
        }

        .preview-banner button {
            margin-left: auto;
            background: none;
            border: 1px solid var(--blueprint);
            color: var(--blueprint);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            padding: 4px 10px;
            cursor: pointer;
        }

        /* ---------- alert banner ---------- */
        .alert-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--oxide-light);
            border: 1px solid var(--oxide);
            color: var(--oxide);
            padding: 10px 14px;
            margin-bottom: 18px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
        }

        .alert-banner strong { font-weight: 600; }

        /* ---------- admin tab bar ---------- */
        .tabbar {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border-bottom: 1.5px solid var(--ink);
            padding-bottom: 0;
        }

        .tabbar button {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 9px 14px;
            border: 1px solid var(--line);
            border-bottom: none;
            background: var(--steel-light);
            color: var(--ink-soft);
            cursor: pointer;
            position: relative;
            top: 1.5px;
        }

        .tabbar button.active {
            background: var(--paper);
            color: var(--ink);
            border-color: var(--ink);
            border-bottom: 1.5px solid var(--paper);
        }

        .section-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ink-soft);
            margin: 0 0 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ---------- indicators ---------- */
        .indicator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .indicator-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-top: 3px solid var(--steel);
            padding: 14px;
        }

        .indicator-card.warn { border-top-color: var(--oxide); }
        .indicator-card .num {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 26px;
            line-height: 1;
            margin-bottom: 4px;
        }

        .indicator-card .num.warn-num { color: var(--oxide); }

        .indicator-card .label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            color: var(--ink-soft);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* ---------- projects strip / cards (reused) ---------- */
        .projects-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .project-card {
            flex: 0 0 210px;
            background: var(--card);
            border: 1px solid var(--line);
            border-top: 3px solid var(--steel);
            padding: 12px 12px 10px;
            cursor: pointer;
        }

        .project-card.active { border-top-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
        .project-card.general { border-top-color: var(--blueprint); }
        .project-card.overdue { border-top-color: var(--oxide); }
        .project-card.readonly { cursor: default; }

        .project-name {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 13.5px;
            margin: 0 0 4px;
        }

        .project-client { font-size: 11.5px; color: var(--ink-soft); margin: 0 0 8px; }
        .project-deadline { font-family: 'IBM Plex Mono', monospace; font-size: 10px; margin: 0 0 8px; color: var(--ink-soft); }
        .project-deadline.overdue { color: var(--oxide); font-weight: 600; }
        .project-bar-track { height: 4px; background: var(--line); margin-bottom: 6px; }
        .project-bar-fill { height: 100%; background: var(--olive); }
        .project-stats { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); display: flex; justify-content: space-between; margin-bottom: 6px; }
        .project-areas { display: flex; gap: 4px; flex-wrap: wrap; }
        .area-chip { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; padding: 1px 5px; letter-spacing: 0.02em; }

        .new-project-form {
            display: none;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 22px;
            background: var(--card);
            border: 1px solid var(--line);
            padding: 14px;
            align-items: center;
        }

        .new-project-form.show { display: flex; }
        .new-project-form input { padding: 9px 10px; border: 1px solid var(--line); font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; }
        .new-project-form input[name=name] { flex: 2; min-width: 160px; }
        .new-project-form input[name=client] { flex: 1.5; min-width: 140px; }
        .new-project-form label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); display: flex; flex-direction: column; gap: 3px; }
        .new-project-form button { padding: 9px 16px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; cursor: pointer; align-self: flex-end; }
        .new-project-form button.cancel { background: var(--paper); color: var(--ink-soft); border-color: var(--line); }

        .add-project-card {
            flex: 0 0 210px;
            border: 1px dashed var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--ink-soft);
            cursor: pointer;
            background: transparent;
        }

        .add-project-card:hover { border-color: var(--blueprint); color: var(--blueprint); }

        .active-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
        .active-head h2 { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600; margin: 0; }
        .active-head .sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }

        .project-toolbar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
        .project-toolbar button { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; padding: 5px 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); cursor: pointer; }
        .project-toolbar button.finalize { border-color: var(--olive); color: var(--olive); }
        .project-toolbar button.edit-btn { border-color: var(--steel); }
        .project-toolbar button.danger { border-color: var(--oxide-light); color: var(--oxide); margin-left: auto; }
        .project-toolbar button.danger:hover { background: var(--oxide-light); }

        .add-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .add-bar input[type=text] { flex: 2; min-width: 180px; padding: 10px 12px; border: 1px solid var(--line); background: var(--card); font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; }
        .add-bar .assignee { flex: 1; min-width: 130px; }
        .add-bar input[type=date] { padding: 9px 8px; border: 1px solid var(--line); background: var(--card); font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); }
        .add-bar select { padding: 10px 8px; border: 1px solid var(--line); background: var(--card); font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
        .add-bar button { padding: 10px 18px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; cursor: pointer; }
        .add-bar button:hover { background: var(--blueprint); border-color: var(--blueprint); }

        .toolbar-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
        .area-filter { display: flex; gap: 6px; flex-wrap: wrap; }
        .area-filter button { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; padding: 5px 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); cursor: pointer; }
        .area-filter button.active { border-color: var(--ink); color: var(--ink); background: var(--steel-light); }
        .sort-toggle { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
        .sort-toggle select { padding: 5px 8px; border: 1px solid var(--line); background: var(--card); font-family: 'IBM Plex Mono', monospace; font-size: 11px; }

        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }

        @media (max-width:720px) {
            .board { grid-template-columns: 1fr; }
            .projects-strip { flex-wrap: nowrap; }
        }

        .col-head { display: flex; align-items: baseline; gap: 8px; border-bottom: 1.5px solid var(--ink); padding-bottom: 8px; margin-bottom: 14px; }
        .col-num { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--steel); }
        .col-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; }
        .col-count { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }

        .cards { display: flex; flex-direction: column; gap: 10px; min-height: 40px; }
        .card { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--steel); padding: 12px 12px 10px; }
        .card.area-produccion { border-left-color: var(--oxide); }
        .card.area-diseno { border-left-color: var(--blueprint); }
        .card.area-gestion { border-left-color: var(--plum); }
        .card.area-compras { border-left-color: var(--amber); }
        .card.area-pedidos { border-left-color: var(--teal); }
        .card.area-cotizacion { border-left-color: var(--indigo); }
        .card.area-montaje { border-left-color: var(--olive); }

        .card-title { font-size: 14px; line-height: 1.4; margin: 0 0 6px; }
        .card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-soft); }
        .card-notes { font-size: 12px; color: var(--ink-soft); font-style: italic; margin: 8px 0 0; padding-left: 8px; border-left: 2px solid var(--line); }

        .tag { padding: 2px 6px; text-transform: uppercase; letter-spacing: 0.03em; }
        .tag.area-produccion { background: var(--oxide-light); color: var(--oxide); }
        .tag.area-diseno { background: var(--blueprint-light); color: var(--blueprint); }
        .tag.area-gestion { background: var(--plum-light); color: var(--plum); }
        .tag.area-compras { background: var(--amber-light); color: var(--amber); }
        .tag.area-pedidos { background: var(--teal-light); color: var(--teal); }
        .tag.area-cotizacion { background: var(--indigo-light); color: var(--indigo); }
        .tag.area-montaje { background: var(--olive-light); color: var(--olive); }
        .tag.urgent { background: var(--oxide); color: var(--paper); }
        .tag.due { color: var(--ink-soft); }
        .tag.overdue { background: var(--oxide); color: var(--paper); }
        .tag.project-tag { background: var(--steel-light); color: var(--ink-soft); }
        .tag.status-open { background: var(--oxide-light); color: var(--oxide); }
        .tag.status-resolved { background: var(--olive-light); color: var(--olive); }

        .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
        .move-btns { display: flex; gap: 6px; }
        .move-btns button, .del-btn, .edit-btn-sm, .resolve-btn {
            border: 1px solid var(--line); background: none; color: var(--ink-soft);
            font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 3px 7px; cursor: pointer;
        }
        .move-btns button:hover { border-color: var(--blueprint); color: var(--blueprint); }
        .move-btns button:disabled { opacity: 0.25; cursor: default; }
        .del-btn:hover { border-color: var(--oxide); color: var(--oxide); }
        .edit-btn-sm:hover { border-color: var(--blueprint); color: var(--blueprint); }
        .resolve-btn { border-color: var(--olive); color: var(--olive); }
        .resolve-btn:hover { background: var(--olive-light); }
        .card-actions-right { display: flex; gap: 6px; }
        .empty { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--steel); }

        .edit-form { display: flex; flex-direction: column; gap: 6px; }
        .edit-form input, .edit-form select, .edit-form textarea { padding: 7px 8px; border: 1px solid var(--line); font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; }
        .edit-form textarea { resize: vertical; min-height: 44px; }
        .edit-form .row { display: flex; gap: 6px; flex-wrap: wrap; }
        .edit-form .row-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 2px; }
        .edit-form .row-actions button { padding: 6px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); }
        .edit-form .row-actions button.cancel { background: var(--paper); color: var(--ink-soft); border-color: var(--line); }

        .today-list { display: flex; flex-direction: column; gap: 10px; }
        .today-item { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--steel); padding: 12px; }
        .today-item.overdue { border-left-color: var(--oxide); }
        .today-item .top-row { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
        .today-item .title { font-size: 14px; margin: 0 0 6px; }
        .today-item .meta { display: flex; gap: 6px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-soft); }

        .done-btn { border: 1px solid var(--olive); color: var(--olive); background: none; font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
        .done-btn:hover { background: var(--olive-light); }

        .week-group { margin-bottom: 20px; }
        .week-group-head { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; display: flex; gap: 8px; align-items: baseline; }
        .week-group-head .day-count { margin-left: auto; color: var(--steel); }

        .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .cal-head .cal-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; text-transform: capitalize; }
        .cal-head button { border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 5px 10px; cursor: pointer; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 20px; }
        .cal-dow { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; text-transform: uppercase; color: var(--steel); text-align: center; padding-bottom: 4px; }
        .cal-day { background: var(--card); border: 1px solid var(--line); min-height: 56px; padding: 5px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
        .cal-day.empty { background: transparent; border-color: transparent; cursor: default; }
        .cal-day.today { border-color: var(--ink); border-width: 2px; }
        .cal-day.selected { background: var(--steel-light); box-shadow: inset 0 0 0 1px var(--ink); }
        .cal-day.overdue-day { border-color: var(--oxide); }
        .cal-day-num { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }
        .cal-dots { display: flex; gap: 2px; flex-wrap: wrap; }
        .cal-dot { width: 6px; height: 6px; border-radius: 50%; }
        .cal-dot.area-produccion { background: var(--oxide); }
        .cal-dot.area-diseno { background: var(--blueprint); }
        .cal-dot.area-gestion { background: var(--plum); }
        .cal-dot.area-compras { background: var(--amber); }
        .cal-dot.area-pedidos { background: var(--teal); }
        .cal-dot.area-cotizacion { background: var(--indigo); }
        .cal-dot.area-montaje { background: var(--olive); }

        .view-buttons { display: flex; gap: 8px; margin-bottom: 20px; }
        .today-btn { display: flex; align-items: center; gap: 8px; background: var(--ink); color: var(--paper); border: none; padding: 10px 16px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; flex: 1; justify-content: center; }
        .today-btn .count { background: var(--oxide); color: #fff; padding: 1px 7px; font-size: 11px; }
        .today-btn.in-today { background: var(--blueprint); }

        /* ---------- incidents & notes ---------- */
        .incident-card, .note-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 3px solid var(--steel);
            padding: 12px 14px;
            margin-bottom: 10px;
        }
        .incident-card.open { border-left-color: var(--oxide); }
        .incident-card.resolved { border-left-color: var(--olive); }
        .incident-card .top-row { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
        .incident-card h3, .note-card h3 { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; margin: 0 0 6px; }
        .incident-card p, .note-card p { font-size: 13px; line-height: 1.5; margin: 6px 0; }
        .incident-card .meta, .note-card .meta { display: flex; gap: 6px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-soft); }
        .resolution-box { background: var(--olive-light); border-left: 2px solid var(--olive); padding: 8px 10px; margin-top: 8px; font-size: 12.5px; }
        .resolution-box .rlabel { font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; color: var(--olive); display: block; margin-bottom: 3px; }

        .inline-form {
            background: var(--card);
            border: 1px solid var(--line);
            padding: 14px;
            margin-bottom: 18px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        .inline-form.show { display: flex; }
        .inline-form input, .inline-form select, .inline-form textarea { padding: 8px 10px; border: 1px solid var(--line); font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; }
        .inline-form textarea { min-height: 60px; resize: vertical; }
        .inline-form .row { display: flex; gap: 8px; flex-wrap: wrap; }
        .inline-form .row-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .inline-form .row-actions button { padding: 7px 14px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); }
        .inline-form .row-actions button.cancel { background: var(--paper); color: var(--ink-soft); border-color: var(--line); }

        .open-form-btn {
            padding: 9px 16px;
            border: 1px solid var(--ink);
            background: var(--ink);
            color: var(--paper);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11.5px;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 14px;
        }
        .open-form-btn.secondary { background: var(--card); color: var(--ink); }

        /* ---------- collaborator dashboard ---------- */
        .collab-head { margin-bottom: 18px; }
        .collab-head h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px; margin: 0 0 4px; }
        .collab-head .sub { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); }
        .collab-section { margin-bottom: 28px; }
        .collab-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        @media (max-width:720px) { .collab-cols { grid-template-columns: 1fr; } .indicator-grid { grid-template-columns: repeat(2,1fr); } }
    </style>
</head>

<body>

    <div class="head">
        <h1>PME — Plataforma operativa<span class="mock-flag">maqueta · datos simulados</span></h1>
        <div class="meta" id="today"></div>
    </div>

    <div class="role-bar">
        <p class="section-label"><span>Ver como</span></p>
        <div class="role-chips" id="role-chips"></div>
    </div>

    <div id="preview-banner-holder"></div>
    <div id="alert-banner-holder"></div>

    <div id="app-root"></div>

    <script>
        /* ================= datos simulados (sin backend, sin persistencia) ================= */
        const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
        const todayStr = () => new Date().toISOString().slice(0, 10);

        const AREA_ORDER = ['produccion', 'diseno', 'gestion', 'compras', 'pedidos', 'cotizacion', 'montaje'];
        const AREA_LABEL = { produccion: 'Producción', diseno: 'Diseño', gestion: 'Gestión', compras: 'Compras', pedidos: 'Pedidos', cotizacion: 'Cotización', montaje: 'Montaje' };
        const AREA_CODE = { produccion: 'PR', diseno: 'DI', gestion: 'GE', compras: 'CO', pedidos: 'PE', cotizacion: 'CZ', montaje: 'MO' };

        const TEAM = [
            { id: 'm1', name: 'Marco Reyes', area: 'produccion' },
            { id: 'm2', name: 'Sofía Nava', area: 'produccion' },
            { id: 'm3', name: 'Iván Torres', area: 'produccion' },
            { id: 'm4', name: 'Diego Palma', area: 'produccion' },
            { id: 'm5', name: 'Renata Cruz', area: 'diseno' },
            { id: 'm6', name: 'Paola Guzmán', area: 'gestion' },
            { id: 'm7', name: 'Héctor Luna', area: 'montaje' },
            { id: 'm8', name: 'Karla Ibarra', area: 'montaje' },
        ];

        const DATA = {
            projects: [
                { id: 'p1', name: 'Sala interactiva — Historia Natural', client: 'Museo de Historia Natural', deadline: addDays(9), status: 'activo' },
                { id: 'p2', name: 'Exhibición itinerante — Ciencia y Tecnología', client: 'Instituto de Ciencia Aplicada', deadline: addDays(24), status: 'activo' },
                { id: 'p3', name: 'Montaje temporal — Bienal de Arte', client: 'Bienal de Arte Contemporáneo', deadline: addDays(-2), status: 'activo' },
            ],
            tasks: [
                { id: 't1', title: 'Cortar PTR 5x5 estructura base', area: 'produccion', assignee: 'Marco Reyes', due: addDays(1), priority: 'urgente', notes: 'Verificar tolerancia de 2mm', projectId: 'p1', col: 0 },
                { id: 't2', title: 'Soldar marco vitrina principal', area: 'produccion', assignee: 'Iván Torres', due: addDays(3), priority: 'normal', notes: '', projectId: 'p1', col: 1 },
                { id: 't3', title: 'Render final para aprobación de cliente', area: 'diseno', assignee: 'Renata Cruz', due: addDays(-1), priority: 'urgente', notes: 'Cliente pidió cambio de paleta', projectId: 'p1', col: 1 },
                { id: 't4', title: 'Cotizar acrílico 6mm para vitrinas', area: 'cotizacion', assignee: 'Paola Guzmán', due: addDays(2), priority: 'normal', notes: '', projectId: 'p1', col: 0 },
                { id: 't5', title: 'Montaje de gráficos murales', area: 'montaje', assignee: 'Héctor Luna', due: addDays(8), priority: 'normal', notes: '', projectId: 'p1', col: 0 },
                { id: 't6', title: 'Diseño de sistema modular de paneles', area: 'diseno', assignee: 'Renata Cruz', due: addDays(5), priority: 'normal', notes: '', projectId: 'p2', col: 1 },
                { id: 't7', title: 'Pedido de perfil de aluminio', area: 'pedidos', assignee: 'Paola Guzmán', due: addDays(0), priority: 'urgente', notes: 'Proveedor confirma stock', projectId: 'p2', col: 0 },
                { id: 't8', title: 'Soldadura de base rodante', area: 'produccion', assignee: 'Diego Palma', due: addDays(6), priority: 'normal', notes: '', projectId: 'p2', col: 0 },
                { id: 't9', title: 'Compra de tornillería inoxidable', area: 'compras', assignee: 'Sofía Nava', due: addDays(4), priority: 'normal', notes: '', projectId: 'p2', col: 2 },
                { id: 't10', title: 'Montaje final en sitio', area: 'montaje', assignee: 'Karla Ibarra', due: addDays(-2), priority: 'urgente', notes: 'Museo exige entrega antes del evento', projectId: 'p3', col: 1 },
                { id: 't11', title: 'Ajuste de anclajes de piso', area: 'produccion', assignee: 'Marco Reyes', due: addDays(-1), priority: 'urgente', notes: '', projectId: 'p3', col: 0 },
                { id: 't12', title: 'Verificación de acabados', area: 'gestion', assignee: 'Paola Guzmán', due: addDays(1), priority: 'normal', notes: '', projectId: 'p3', col: 0 },
                { id: 't13', title: 'Actualizar bitácora de mantenimiento de herramientas', area: 'gestion', assignee: 'Paola Guzmán', due: '', priority: 'normal', notes: '', projectId: 'general', col: 0 },
                { id: 't14', title: 'Revisar inventario de EPP', area: 'produccion', assignee: 'Diego Palma', due: addDays(10), priority: 'normal', notes: '', projectId: 'general', col: 0 },
            ],
            incidents: [
                { id: 'i1', title: 'Falta de material — perfil de aluminio', description: 'El proveedor retrasó la entrega del perfil, puede afectar la fecha de entrega del proyecto.', projectId: 'p2', taskId: 't7', reportedBy: 'Paola Guzmán', reportedAt: addDays(-1), status: 'open', resolvedBy: '', resolvedAt: '', resolution: '' },
                { id: 'i2', title: 'Vitrina dañada en transporte', description: 'Se detectó una fisura en el vidrio de la vitrina principal al recibirla en taller.', projectId: 'p1', taskId: 't2', reportedBy: 'Iván Torres', reportedAt: addDays(-3), status: 'resolved', resolvedBy: 'Administrador', resolvedAt: addDays(-2), resolution: 'Se solicitó reposición al proveedor, nueva pieza en camino.' },
                { id: 'i3', title: 'Anclaje de piso incompatible con base existente', description: 'El tipo de piso del museo no permite el anclaje planeado, hay que rediseñar la base.', projectId: 'p3', taskId: 't11', reportedBy: 'Marco Reyes', reportedAt: addDays(-1), status: 'open', resolvedBy: '', resolvedAt: '', resolution: '' },
            ],
            notes: [
                { id: 'n1', text: 'Terminamos el corte de estructura antes de lo previsto, podemos adelantar soldadura.', author: 'Marco Reyes', projectId: 'p1', taskId: 't1', createdAt: addDays(0) },
                { id: 'n2', text: 'El cliente aprobó la paleta de color nueva, ya no hace falta el cambio pendiente.', author: 'Renata Cruz', projectId: 'p1', taskId: 't3', createdAt: addDays(-1) },
                { id: 'n3', text: 'Confirmar con el museo el horario de acceso para montaje del fin de semana.', author: 'Karla Ibarra', projectId: 'p3', taskId: '', createdAt: addDays(-1) },
            ],
        };

        const GENERAL_PROJECT = { id: 'general', name: 'Tareas generales', client: 'Sin proyecto asignado', deadline: '', status: 'activo', general: true };

        /* ================= estado de UI (en memoria, se reinicia al recargar) ================= */
        let viewAs = 'admin'; // 'admin' | member id
        let adminTab = 'resumen'; // resumen | proyectos | incidencias | notas
        let activeProjectId = 'general';
        let activeAreaFilter = 'todas';
        let sortMode = 'due';
        let showFinished = false;
        let editingTaskId = null;
        let editingProjectId = null;
        let viewMode = 'project'; // project | today | week | calendar (dentro de la pestaña Proyectos)
        let calYear = new Date().getFullYear();
        let calMonth = new Date().getMonth();
        let selectedCalDay = null;
        let noteFormOpen = false;
        let incidentFormOpen = false;

        document.getElementById('today').textContent = new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });

        /* ================= helpers compartidos ================= */
        function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str || ''; return div.innerHTML; }
        function escapeAttr(str) { return (str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
        function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y.slice(2)}`; }
        function isOverdue(iso, col) { return iso && col !== 2 && iso < todayStr(); }
        function isDueToday(iso, col) { return iso && col !== 2 && iso === todayStr(); }
        function allProjects() { return [GENERAL_PROJECT, ...DATA.projects]; }
        function projectById(pid) { return allProjects().find(p => p.id === pid); }
        function projectName(pid) { const p = projectById(pid); return p ? p.name : '—'; }
        function taskById(tid) { return DATA.tasks.find(t => t.id === tid); }
        function projectTasks(pid) { return DATA.tasks.filter(t => t.projectId === pid); }
        function memberById(id) { return TEAM.find(m => m.id === id); }

        function sortedProjectList() {
            const active = DATA.projects.filter(p => p.status !== 'finalizado');
            const finished = DATA.projects.filter(p => p.status === 'finalizado');
            const byDeadline = arr => {
                const withD = arr.filter(p => p.deadline);
                const withoutD = arr.filter(p => !p.deadline);
                withD.sort((a, b) => a.deadline.localeCompare(b.deadline));
                return [...withD, ...withoutD];
            };
            return showFinished ? [...byDeadline(active), ...byDeadline(finished)] : byDeadline(active);
        }

        function areaOptions(selected) {
            return AREA_ORDER.map(a => `<option value="${a}" ${a === selected ? 'selected' : ''}>${AREA_LABEL[a]}</option>`).join('');
        }
        function memberOptions(selected) {
            const opts = TEAM.map(m => `<option value="${escapeAttr(m.name)}" ${m.name === selected ? 'selected' : ''}>${escapeHtml(m.name)} — ${AREA_LABEL[m.area]}</option>`).join('');
            return `<option value="">— sin responsable —</option>` + opts;
        }
        function projectOptions(selected) {
            return allProjects().map(p => `<option value="${p.id}" ${p.id === selected ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('');
        }
        function taskOptionsFor(pid, selected) {
            const opts = projectTasks(pid).map(t => `<option value="${t.id}" ${t.id === selected ? 'selected' : ''}>${escapeHtml(t.title)}</option>`).join('');
            return `<option value="">— sin tarea asociada —</option>` + opts;
        }

        /* ================= role switcher ================= */
        function renderRoleChips() {
            const holder = document.getElementById('role-chips');
            const chips = [{ id: 'admin', label: 'Administrador', cls: 'admin' }]
                .concat(TEAM.map(m => ({ id: m.id, label: m.name, cls: 'area-' + m.area })));
            holder.innerHTML = chips.map(c => `
        <button class="role-chip ${c.cls} ${viewAs === c.id ? 'active' : ''}" onclick="setViewAs('${c.id}')">${escapeHtml(c.label)}</button>
      `).join('');
        }

        function setViewAs(id) {
            viewAs = id;
            noteFormOpen = false;
            incidentFormOpen = false;
            renderAll();
        }

        function renderPreviewBanner() {
            const holder = document.getElementById('preview-banner-holder');
            if (viewAs === 'admin') { holder.innerHTML = ''; return; }
            const m = memberById(viewAs);
            holder.innerHTML = `
        <div class="preview-banner">
          👁 vista previa — estás viendo el dashboard de <strong>${escapeHtml(m.name)}</strong> (${AREA_LABEL[m.area]})
          <button onclick="setViewAs('admin')">← volver a administrador</button>
        </div>`;
        }

        /* ================= render raíz ================= */
        function renderAll() {
            renderRoleChips();
            renderPreviewBanner();
            const root = document.getElementById('app-root');
            if (viewAs === 'admin') {
                root.innerHTML = adminShell();
                mountAdminTab();
            } else {
                root.innerHTML = collabShell();
                renderAlertBannerFor(collabTasksFor(viewAs));
                mountCollabSections();
            }
        }

        /* ================= dashboard administrador ================= */
        function adminShell() {
            return `
        <div class="tabbar" id="admin-tabbar">
          <button data-tab="resumen">Resumen</button>
          <button data-tab="proyectos">Proyectos</button>
          <button data-tab="incidencias">Incidencias</button>
          <button data-tab="notas">Notas</button>
        </div>
        <div id="admin-tab-content"></div>
      `;
        }

        function mountAdminTab() {
            document.querySelectorAll('#admin-tabbar button').forEach(b => {
                b.classList.toggle('active', b.dataset.tab === adminTab);
                b.addEventListener('click', () => { adminTab = b.dataset.tab; renderAll(); });
            });
            const content = document.getElementById('admin-tab-content');
            if (adminTab === 'resumen') { content.innerHTML = resumenView(); renderAlertBannerFor(DATA.tasks); return; }
            if (adminTab === 'incidencias') { content.innerHTML = incidenciasView(true); return; }
            if (adminTab === 'notas') { content.innerHTML = notasView(true); return; }
            // proyectos
            content.innerHTML = proyectosViewShell();
            mountProyectosView();
        }

        function resumenView() {
            const activeProj = DATA.projects.filter(p => p.status !== 'finalizado');
            const overdueProj = activeProj.filter(p => p.deadline && p.deadline < todayStr());
            const porHacer = DATA.tasks.filter(t => t.col === 0).length;
            const enCurso = DATA.tasks.filter(t => t.col === 1).length;
            const hecho = DATA.tasks.filter(t => t.col === 2).length;
            const overdueTasks = DATA.tasks.filter(t => isOverdue(t.due, t.col));
            const openIncidents = DATA.incidents.filter(i => i.status === 'open');
            const cards = [
                { num: activeProj.length, label: 'Proyectos activos', warn: false },
                { num: overdueProj.length, label: 'Proyectos vencidos', warn: overdueProj.length > 0 },
                { num: porHacer, label: 'Tareas por hacer', warn: false },
                { num: enCurso, label: 'Tareas en curso', warn: false },
                { num: hecho, label: 'Tareas hechas', warn: false },
                { num: overdueTasks.length, label: 'Tareas vencidas', warn: overdueTasks.length > 0 },
                { num: openIncidents.length, label: 'Incidencias abiertas', warn: openIncidents.length > 0 },
            ];
            const attention = [
                ...overdueTasks.map(t => ({ kind: 'Tarea vencida', title: t.title, sub: projectName(t.projectId) + ' · ' + (t.assignee || 'sin responsable') })),
                ...openIncidents.map(i => ({ kind: 'Incidencia abierta', title: i.title, sub: projectName(i.projectId) + ' · reportó ' + i.reportedBy })),
            ];
            return `
        <div class="indicator-grid">
          ${cards.map(c => `
            <div class="indicator-card ${c.warn ? 'warn' : ''}">
              <div class="num ${c.warn ? 'warn-num' : ''}">${c.num}</div>
              <div class="label">${c.label}</div>
            </div>`).join('')}
        </div>
        <p class="section-label"><span>Necesita tu atención</span></p>
        ${attention.length === 0 ? '<div class="empty">Nada pendiente de atención en este momento.</div>' :
                    `<div class="today-list">${attention.map(a => `
            <div class="today-item overdue">
              <p class="title">${escapeHtml(a.title)}</p>
              <div class="meta"><span class="tag overdue">${a.kind}</span><span>${escapeHtml(a.sub)}</span></div>
            </div>`).join('')}</div>`}
      `;
        }

        function incidenciasView(isAdmin) {
            const list = [...DATA.incidents].sort((a, b) => (a.status === 'open' ? 0 : 1) - (b.status === 'open' ? 0 : 1) || b.reportedAt.localeCompare(a.reportedAt));
            return `
        <p class="section-label"><span>Incidencias</span></p>
        ${list.length === 0 ? '<div class="empty">Sin incidencias registradas.</div>' : list.map(i => incidentCardHtml(i, isAdmin)).join('')}
      `;
        }

        function incidentCardHtml(i, isAdmin) {
            return `
        <div class="incident-card ${i.status}">
          <div class="top-row">
            <div>
              <h3>${escapeHtml(i.title)}</h3>
              <div class="meta">
                <span class="tag project-tag">${escapeHtml(projectName(i.projectId))}</span>
                ${i.taskId ? `<span>${escapeHtml((taskById(i.taskId) || {}).title || '')}</span>` : ''}
                <span>reportó ${escapeHtml(i.reportedBy)} · ${fmtDate(i.reportedAt)}</span>
                <span class="tag status-${i.status}">${i.status === 'open' ? 'abierta' : 'resuelta'}</span>
              </div>
              <p>${escapeHtml(i.description)}</p>
              ${i.status === 'resolved' ? `
                <div class="resolution-box">
                  <span class="rlabel">Resolución · ${escapeHtml(i.resolvedBy)} · ${fmtDate(i.resolvedAt)}</span>
                  ${escapeHtml(i.resolution)}
                </div>` : ''}
            </div>
            ${isAdmin && i.status === 'open' ? `<button class="resolve-btn" onclick="startResolveIncident('${i.id}')">marcar resuelta</button>` : ''}
          </div>
          <div id="resolve-form-${i.id}"></div>
        </div>
      `;
        }

        function startResolveIncident(id) {
            const holder = document.getElementById('resolve-form-' + id);
            holder.innerHTML = `
        <div class="inline-form show" style="margin-top:10px;">
          <textarea id="resolution-text-${id}" placeholder="Describe cómo se resolvió..."></textarea>
          <div class="row-actions">
            <button class="cancel" onclick="document.getElementById('resolve-form-${id}').innerHTML=''">Cancelar</button>
            <button onclick="confirmResolveIncident('${id}')">Marcar como resuelta</button>
          </div>
        </div>`;
        }

        function confirmResolveIncident(id) {
            const i = DATA.incidents.find(x => x.id === id);
            if (!i) return;
            const text = document.getElementById('resolution-text-' + id).value.trim();
            i.status = 'resolved';
            i.resolvedBy = 'Administrador';
            i.resolvedAt = todayStr();
            i.resolution = text || 'Resuelta sin comentario adicional.';
            renderAll();
        }

        function notasView(isAdmin) {
            const list = [...DATA.notes].sort((a, b) => b.createdAt.localeCompare(a.createdAt));
            return `
        <p class="section-label"><span>Notas del equipo</span></p>
        ${list.length === 0 ? '<div class="empty">Sin notas todavía.</div>' : list.map(n => `
          <div class="note-card">
            <div class="meta">
              <strong>${escapeHtml(n.author)}</strong>
              <span class="tag project-tag">${escapeHtml(projectName(n.projectId))}</span>
              ${n.taskId ? `<span>${escapeHtml((taskById(n.taskId) || {}).title || '')}</span>` : ''}
              <span>${fmtDate(n.createdAt)}</span>
            </div>
            <p>${escapeHtml(n.text)}</p>
          </div>
        `).join('')}
      `;
        }

        /* ---------- pestaña Proyectos (tablero completo, editable) ---------- */
        function proyectosViewShell() {
            return `
        <div class="view-buttons">
          <button class="today-btn" id="today-toggle-btn"></button>
          <button class="today-btn" id="week-toggle-btn"></button>
          <button class="today-btn" id="cal-toggle-btn"></button>
        </div>
        <div id="project-sub-view"></div>
      `;
        }

        function mountProyectosView() {
            renderProyectosButtons();
            document.getElementById('today-toggle-btn').addEventListener('click', () => setSubView(viewMode === 'today' ? 'project' : 'today'));
            document.getElementById('week-toggle-btn').addEventListener('click', () => setSubView(viewMode === 'week' ? 'project' : 'week'));
            document.getElementById('cal-toggle-btn').addEventListener('click', () => setSubView(viewMode === 'calendar' ? 'project' : 'calendar'));
            renderProjectSubView();
        }

        function setSubView(mode) { viewMode = mode; renderAll(); }

        function renderProyectosButtons() {
            const overdueTasks = DATA.tasks.filter(t => isOverdue(t.due, t.col));
            const todayTasks = DATA.tasks.filter(t => isDueToday(t.due, t.col));
            const total = overdueTasks.length + todayTasks.length;
            const btn = document.getElementById('today-toggle-btn');
            btn.classList.toggle('in-today', viewMode === 'today');
            btn.innerHTML = viewMode === 'today' ? '← volver a proyectos' : `Ver tareas de hoy ${total ? '<span class="count">' + total + '</span>' : ''}`;

            const weekDates = weekWindowDates();
            const weekTasks = DATA.tasks.filter(t => t.col !== 2 && t.due && weekDates.includes(t.due));
            const weekBtn = document.getElementById('week-toggle-btn');
            weekBtn.classList.toggle('in-today', viewMode === 'week');
            weekBtn.innerHTML = viewMode === 'week' ? '← volver a proyectos' : `Resumen semanal ${weekTasks.length ? '<span class="count">' + weekTasks.length + '</span>' : ''}`;

            const calBtn = document.getElementById('cal-toggle-btn');
            calBtn.classList.toggle('in-today', viewMode === 'calendar');
            calBtn.innerHTML = viewMode === 'calendar' ? '← volver a proyectos' : 'Calendario';
        }

        function weekWindowDates() {
            const dates = [];
            for (let i = 0; i < 7; i++) dates.push(addDays(i));
            return dates;
        }

        function renderProjectSubView() {
            const holder = document.getElementById('project-sub-view');
            if (viewMode === 'today') { holder.innerHTML = todayViewHtml(DATA.tasks); return; }
            if (viewMode === 'week') { holder.innerHTML = weekViewHtml(DATA.tasks); return; }
            if (viewMode === 'calendar') { holder.innerHTML = calendarShellHtml(); mountCalendar(); return; }
            holder.innerHTML = projectBoardShellHtml();
            mountProjectBoard();
        }

        function todayViewHtml(taskPool) {
            const list = taskPool.filter(t => t.col !== 2 && t.due && t.due <= todayStr()).sort((a, b) => a.due.localeCompare(b.due));
            if (list.length === 0) return '<p class="section-label"><span>Tareas de hoy y vencidas</span></p><div class="empty">No hay tareas vencidas ni para hoy. 🎉</div>';
            return `<p class="section-label"><span>Tareas de hoy y vencidas</span></p><div class="today-list">${list.map(t => taskTodayItemHtml(t, true)).join('')}</div>`;
        }

        function taskTodayItemHtml(t, withDone) {
            const overdue = isOverdue(t.due, t.col);
            return `
        <div class="today-item ${overdue ? 'overdue' : ''}">
          <div class="top-row">
            <div>
              <p class="title">${escapeHtml(t.title)}</p>
              <div class="meta">
                <span class="tag project-tag">${escapeHtml(projectName(t.projectId))}</span>

        function weekViewHtml(taskPool) {
            const weekDates = weekWindowDates();
            const groups = weekDates.map(dateIso => ({ dateIso, tasks: taskPool.filter(t => t.col !== 2 && t.due === dateIso) }));
            const any = groups.some(g => g.tasks.length > 0);
            let inner = '<p class="section-label"><span>Resumen de la semana</span></p>';
            if (!any) return inner + '<div class="empty">No hay entregas programadas en los próximos 7 días.</div>';
            const dayLabel = iso => { const d = new Date(iso + 'T00:00:00'); const l = d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'short' }); return iso === todayStr() ? l + ' (hoy)' : l; };
            inner += groups.map(g => `
        <div class="week-group">
          <div class="week-group-head"><span>${dayLabel(g.dateIso)}</span><span class="day-count">${g.tasks.length ? g.tasks.length + ' tarea' + (g.tasks.length > 1 ? 's' : '') : 'sin entregas'}</span></div>
          ${g.tasks.length ? `<div class="today-list">${g.tasks.map(t => taskTodayItemHtml(t, true)).join('')}</div>` : ''}

        function calendarShellHtml() {
            return `
        <div class="cal-head"><button id="cal-prev-btn">&larr;</button><span class="cal-title" id="cal-title"></span><button id="cal-next-btn">&rarr;</button></div>
        <div class="cal-grid" id="cal-grid"></div>
        <p class="section-label" id="cal-day-label" style="display:none;"></p>
        <div class="today-list" id="cal-day-tasks"></div>
      `;
        }

        function mountCalendar() {
            document.getElementById('cal-prev-btn').addEventListener('click', () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } selectedCalDay = null; renderCalendar(); });
            document.getElementById('cal-next-btn').addEventListener('click', () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } selectedCalDay = null; renderCalendar(); });
            renderCalendar();
        }

        function tasksForDate(iso) { return DATA.tasks.filter(t => t.col !== 2 && t.due === iso); }

        function renderCalendar() {
            const first = new Date(calYear, calMonth, 1);
            const startWeekday = first.getDay();
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
            document.getElementById('cal-title').textContent = first.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' });
            const dows = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];
            let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');
            for (let i = 0; i < startWeekday; i++) html += '<div class="cal-day empty"></div>';
            for (let day = 1; day <= daysInMonth; day++) {
                const iso = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const tasks = tasksForDate(iso);
                const overdueHere = tasks.some(t => isOverdue(t.due, t.col));
                const areasPresent = [...new Set(tasks.map(t => t.area))];
                const classes = ['cal-day'];
                if (iso === todayStr()) classes.push('today');
                if (iso === selectedCalDay) classes.push('selected');
                if (overdueHere) classes.push('overdue-day');
                html += `<div class="${classes.join(' ')}" onclick="selectCalDay('${iso}')"><span class="cal-day-num">${day}</span><div class="cal-dots">${areasPresent.map(a => `<span class="cal-dot area-${a}"></span>`).join('')}</div></div>`;
            }
            document.getElementById('cal-grid').innerHTML = html;
            const label = document.getElementById('cal-day-label');
            const taskList = document.getElementById('cal-day-tasks');
            if (!selectedCalDay) { label.style.display = 'none'; taskList.innerHTML = ''; return; }
            label.style.display = 'block';
            label.textContent = new Date(selectedCalDay + 'T00:00:00').toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
            const tasks = tasksForDate(selectedCalDay);
            taskList.innerHTML = tasks.length === 0 ? '<div class="empty">Sin tareas con esa fecha de entrega.</div>' : tasks.map(t => taskTodayItemHtml(t, true)).join('');
        }

        function selectCalDay(iso) { selectedCalDay = selectedCalDay === iso ? null : iso; renderCalendar(); }

        function selectProject(pid) { activeProjectId = pid; activeAreaFilter = 'todas'; editingTaskId = null; document.getElementById('new-project-form').classList.remove('show'); renderProjectsStrip(); renderActiveHead(); renderBoard(); document.querySelectorAll('#area-filter button').forEach(b => b.classList.toggle('active', b.dataset.area === 'todas')); }

            const p = DATA.projects.find(x => x.id === activeProjectId);

            editingProjectId = p.id;
            const form = document.getElementById('new-project-form');
            form.querySelector('[name=name]').value = p.name;

            form.querySelector('[name=deadline]').value = p.deadline || '';

            form.classList.add('show');
            form.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function addOrUpdateProject() {
            const form = document.getElementById('new-project-form');
            const name = form.querySelector('[name=name]').value.trim();
            const client = form.querySelector('[name=client]').value.trim();
            const deadline = form.querySelector('[name=deadline]').value;
            if (!name) return;
            if (editingProjectId) {
                const p = DATA.projects.find(x => x.id === editingProjectId);
                if (p) { p.name = name; p.client = client; p.deadline = deadline; }
                editingProjectId = null;
            } else {
                const id = 'p' + Date.now();
                DATA.projects.push({ id, name, client, deadline, status: 'activo' });
                activeProjectId = id;
            }
            form.querySelectorAll('input').forEach(i => i.value = '');
            form.classList.remove('show');
            document.getElementById('save-project-btn').textContent = 'Crear';
            renderProjectsStrip(); renderActiveHead(); renderBoard();

        function deleteProject() {
            if (activeProjectId === 'general') return;

            DATA.projects = DATA.projects.filter(p => p.id !== activeProjectId);
            DATA.tasks = DATA.tasks.filter(t => t.projectId !== activeProjectId);
            activeProjectId = 'general';
            renderProjectsStrip(); renderActiveHead(); renderBoard();

            const due = document.getElementById('due-input').value;
            const priority = document.getElementById('priority-input').value;
            const notes = document.getElementById('notes-input').value.trim();

            DATA.tasks.push({ id: 't' + Date.now(), title, assignee, area, due, priority, notes, projectId: activeProjectId, col: 0, createdAt: Date.now() });
            document.getElementById('task-input').value = '';
            document.getElementById('assignee-input').value = '';
            document.getElementById('due-input').value = '';
            document.getElementById('notes-input').value = '';

            t.due = wrap.querySelector('.f-due').value;

            </div>`).join('')}
        </div>

        <div class="collab-section">
          <p class="section-label"><span>Incidencias</span></p>
          <button class="open-form-btn" onclick="toggleIncidentForm()">${incidentFormOpen ? 'cancelar' : '+ reportar incidencia'}</button>
          <div class="inline-form ${incidentFormOpen ? 'show' : ''}" id="incident-form">
            <input type="text" id="incident-title" placeholder="Título breve de la incidencia">
            <textarea id="incident-desc" placeholder="Describe el problema..."></textarea>
            <div class="row">
              <select id="incident-project">${projectOptions(myProjectIds[0] || '')}</select>
              <select id="incident-task"></select>
            </div>
            <div class="row-actions"><button class="cancel" onclick="toggleIncidentForm()">Cancelar</button><button onclick="submitIncident()">Reportar incidencia</button></div>
          </div>
          ${myIncidents.length === 0 ? '<div class="empty">No has reportado incidencias.</div>' : myIncidents.map(i => incidentCardHtml(i, false)).join('')}
        </div>
      `;

            const noteProjectSel = document.getElementById('note-project');
            const noteTaskSel = document.getElementById('note-task');
            const refreshNoteTasks = () => { noteTaskSel.innerHTML = taskOptionsFor(noteProjectSel.value, ''); };
            if (noteProjectSel) { noteProjectSel.addEventListener('change', refreshNoteTasks); refreshNoteTasks(); }

            const incProjectSel = document.getElementById('incident-project');
            const incTaskSel = document.getElementById('incident-task');
            const refreshIncTasks = () => { incTaskSel.innerHTML = taskOptionsFor(incProjectSel.value, ''); };
            if (incProjectSel) { incProjectSel.addEventListener('change', refreshIncTasks); refreshIncTasks(); }
        }

        function toggleNoteForm() { noteFormOpen = !noteFormOpen; renderAll(); }
        function toggleIncidentForm() { incidentFormOpen = !incidentFormOpen; renderAll(); }

        function submitNote() {
            const text = document.getElementById('note-text').value.trim();
            if (!text) return;
            const m = memberById(viewAs);
            DATA.notes.push({ id: 'n' + Date.now(), text, author: m.name, projectId: document.getElementById('note-project').value, taskId: document.getElementById('note-task').value, createdAt: todayStr() });
            noteFormOpen = false;
            renderAll();
        }

        function submitIncident() {
            const title = document.getElementById('incident-title').value.trim();
            const description = document.getElementById('incident-desc').value.trim();
            if (!title || !description) return;
            const m = memberById(viewAs);
            DATA.incidents.push({ id: 'i' + Date.now(), title, description, projectId: document.getElementById('incident-project').value, taskId: document.getElementById('incident-task').value, reportedBy: m.name, reportedAt: todayStr(), status: 'open', resolvedBy: '', resolvedAt: '', resolution: '' });
            incidentFormOpen = false;
            renderAll();
        }

        /* ================= banner de alertas (compartido) ================= */
        function renderAlertBannerFor(taskPool) {
            const overdueTasks = taskPool.filter(t => isOverdue(t.due, t.col));
            const todayTasks = taskPool.filter(t => isDueToday(t.due, t.col));
            const holder = document.getElementById('alert-banner-holder');
            if (overdueTasks.length === 0 && todayTasks.length === 0) { holder.innerHTML = ''; return; }
            const parts = [];
            if (overdueTasks.length) parts.push(`<strong>${overdueTasks.length}</strong> vencida${overdueTasks.length > 1 ? 's' : ''}`);
            if (todayTasks.length) parts.push(`<strong>${todayTasks.length}</strong> para hoy`);
            const goTo = viewAs === 'admin' ? "goToday()" : '';
            holder.innerHTML = `<div class="alert-banner" ${viewAs === 'admin' ? 'style="cursor:pointer;" onclick="goToday()"' : ''}>⚠ ${parts.join(' · ')}${viewAs === 'admin' ? ' — toca para ver' : ''}</div>`;
        }

        function goToday() { adminTab = 'proyectos'; viewMode = 'today'; renderAll(); }

        renderAll();
    </script>

</body>

</html>
