<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PME — Plataforma operativa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --paper: #F1EDE3;
            --ink: #2B2B28;
            --ink-soft: #5C5A52;
            --blueprint: #2C5F74;
            --blueprint-light: #E4EEF0;
            --oxide: #B5502D;
            --oxide-light: #F7E6DE;
            --olive: #5C6B3E;
            --olive-light: #E8ECDC;
            --plum: #6B4A6B;
            --plum-light: #EFE3EC;
            --amber: #9C7A1F;
            --amber-light: #F5EAD3;
            --teal: #1F7A6C;
            --teal-light: #DCEFEB;
            --indigo: #4C4A8C;
            --indigo-light: #E4E3F2;
            --steel: #6E6B62;
            --steel-light: #EAE8E1;
            --line: #D8D3C4;
            --card: #FFFFFF;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: 'IBM Plex Sans', sans-serif;
            padding: 20px 16px 60px;
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 14px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .head h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 22px;
            margin: 0;
        }

        .head .meta {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--ink-soft);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* ---------- sesión ---------- */
        .session-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
            margin-bottom: 16px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11.5px;
            color: var(--ink-soft);
        }

        .session-bar .role-tag {
            font-size: 10px;
            padding: 2px 7px;
            background: var(--steel-light);
        }

        .session-bar button {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink-soft);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            padding: 5px 10px;
            cursor: pointer;
        }

        .session-bar button:hover { border-color: var(--oxide); color: var(--oxide); }

        /* ---------- login / pendiente ---------- */
        .gate-screen {
            max-width: 420px;
            margin: 60px auto;
            text-align: center;
            background: var(--card);
            border: 1px solid var(--line);
            border-top: 3px solid var(--ink);
            padding: 32px 28px;
        }

        .gate-screen h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 18px;
            margin: 0 0 10px;
        }

        .gate-screen p {
            font-size: 13.5px;
            color: var(--ink-soft);
            line-height: 1.6;
            margin: 0 0 20px;
        }

        .google-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 11px 20px;
            border: 1px solid var(--ink);
            background: var(--ink);
            color: var(--paper);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12.5px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .google-btn:hover { background: var(--blueprint); border-color: var(--blueprint); }

        .gate-badge {
            display: inline-block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: var(--amber-light);
            color: var(--amber);
            padding: 3px 9px;
            margin-bottom: 14px;
        }

        .gate-badge.err { background: var(--oxide-light); color: var(--oxide); }

        /* ---------- Usuarios (admin) ---------- */
        .user-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 3px solid var(--steel);
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .user-row.pending { border-left-color: var(--amber); }
        .user-row.active { border-left-color: var(--olive); }
        .user-row.revoked { border-left-color: var(--oxide); opacity: 0.75; }

        .user-row .who { flex: 1; min-width: 160px; }
        .user-row .who .name { font-size: 13.5px; margin: 0; }
        .user-row .who .email { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-soft); }

        .user-row select {
            padding: 6px 8px;
            border: 1px solid var(--line);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
        }

        .user-row button {
            border: 1px solid var(--olive);
            color: var(--olive);
            background: none;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            padding: 6px 10px;
            cursor: pointer;
        }

        .user-row button.revoke { border-color: var(--oxide); color: var(--oxide); }
        .user-row button:hover { opacity: 0.7; }

        /* ---------- alert banner ---------- */
        .alert-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--oxide-light);
            border: 1px solid var(--oxide);
            color: var(--oxide);
            padding: 10px 14px;
            margin-bottom: 18px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
        }

        .alert-banner strong { font-weight: 600; }

        /* ---------- admin tab bar ---------- */
        .tabbar {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border-bottom: 1.5px solid var(--ink);
            padding-bottom: 0;
        }

        .tabbar button {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 9px 14px;
            border: 1px solid var(--line);
            border-bottom: none;
            background: var(--steel-light);
            color: var(--ink-soft);
            cursor: pointer;
            position: relative;
            top: 1.5px;
        }

        .tabbar button.active {
            background: var(--paper);
            color: var(--ink);
            border-color: var(--ink);
            border-bottom: 1.5px solid var(--paper);
        }

        .section-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ink-soft);
            margin: 0 0 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ---------- indicators ---------- */
        .indicator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .indicator-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-top: 3px solid var(--steel);
            padding: 14px;
        }

        .indicator-card.warn { border-top-color: var(--oxide); }
        .indicator-card .num {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 26px;
            line-height: 1;
            margin-bottom: 4px;
        }

        .indicator-card .num.warn-num { color: var(--oxide); }

        .indicator-card .label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            color: var(--ink-soft);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* ---------- projects strip / cards (reused) ---------- */
        .projects-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .project-card {
            flex: 0 0 210px;
            background: var(--card);
            border: 1px solid var(--line);
            border-top: 3px solid var(--steel);
            padding: 12px 12px 10px;
            cursor: pointer;
        }

        .project-card.active { border-top-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
        .project-card.general { border-top-color: var(--blueprint); }
        .project-card.overdue { border-top-color: var(--oxide); }
        .project-card.readonly { cursor: default; }

        .project-name {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 13.5px;
            margin: 0 0 4px;
        }

        .project-client { font-size: 11.5px; color: var(--ink-soft); margin: 0 0 8px; }
        .project-deadline { font-family: 'IBM Plex Mono', monospace; font-size: 10px; margin: 0 0 8px; color: var(--ink-soft); }
        .project-deadline.overdue { color: var(--oxide); font-weight: 600; }
        .project-bar-track { height: 4px; background: var(--line); margin-bottom: 6px; }
        .project-bar-fill { height: 100%; background: var(--olive); }
        .project-stats { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); display: flex; justify-content: space-between; margin-bottom: 6px; }
        .project-areas { display: flex; gap: 4px; flex-wrap: wrap; }
        .area-chip { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; padding: 1px 5px; letter-spacing: 0.02em; }

        .new-project-form {
            display: none;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 22px;
            background: var(--card);
            border: 1px solid var(--line);
            padding: 14px;
            align-items: center;
        }

        .new-project-form.show { display: flex; }
        .new-project-form input { padding: 9px 10px; border: 1px solid var(--line); font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; }
        .new-project-form input[name=name] { flex: 2; min-width: 160px; }
        .new-project-form input[name=client] { flex: 1.5; min-width: 140px; }
        .new-project-form label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); display: flex; flex-direction: column; gap: 3px; }
        .new-project-form button { padding: 9px 16px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; cursor: pointer; align-self: flex-end; }
        .new-project-form button.cancel { background: var(--paper); color: var(--ink-soft); border-color: var(--line); }

        .add-project-card {
            flex: 0 0 210px;
            border: 1px dashed var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--ink-soft);
            cursor: pointer;
            background: transparent;
        }

        .add-project-card:hover { border-color: var(--blueprint); color: var(--blueprint); }

        .active-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
        .active-head h2 { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600; margin: 0; }
        .active-head .sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }

        .project-toolbar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
        .project-toolbar button { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; padding: 5px 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); cursor: pointer; }
        .project-toolbar button.finalize { border-color: var(--olive); color: var(--olive); }
        .project-toolbar button.edit-btn { border-color: var(--steel); }
        .project-toolbar button.danger { border-color: var(--oxide-light); color: var(--oxide); margin-left: auto; }
        .project-toolbar button.danger:hover { background: var(--oxide-light); }

        .add-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .add-bar input[type=text] { flex: 2; min-width: 180px; padding: 10px 12px; border: 1px solid var(--line); background: var(--card); font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; }
        .add-bar .assignee { flex: 1; min-width: 130px; }
        .add-bar input[type=date] { padding: 9px 8px; border: 1px solid var(--line); background: var(--card); font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); }
        .add-bar select { padding: 10px 8px; border: 1px solid var(--line); background: var(--card); font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
        .add-bar button { padding: 10px 18px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; cursor: pointer; }
        .add-bar button:hover { background: var(--blueprint); border-color: var(--blueprint); }

        .toolbar-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
        .area-filter { display: flex; gap: 6px; flex-wrap: wrap; }
        .area-filter button { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; padding: 5px 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); cursor: pointer; }
        .area-filter button.active { border-color: var(--ink); color: var(--ink); background: var(--steel-light); }
        .sort-toggle { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
        .sort-toggle select { padding: 5px 8px; border: 1px solid var(--line); background: var(--card); font-family: 'IBM Plex Mono', monospace; font-size: 11px; }

        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }

        @media (max-width:720px) {
            .board { grid-template-columns: 1fr; }
            .projects-strip { flex-wrap: nowrap; }
        }

        .col-head { display: flex; align-items: baseline; gap: 8px; border-bottom: 1.5px solid var(--ink); padding-bottom: 8px; margin-bottom: 14px; }
        .col-num { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--steel); }
        .col-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; }
        .col-count { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }

        .cards { display: flex; flex-direction: column; gap: 10px; min-height: 40px; }
        .card { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--steel); padding: 12px 12px 10px; }
        .card.area-produccion { border-left-color: var(--oxide); }
        .card.area-diseno { border-left-color: var(--blueprint); }
        .card.area-gestion { border-left-color: var(--plum); }
        .card.area-compras { border-left-color: var(--amber); }
        .card.area-pedidos { border-left-color: var(--teal); }
        .card.area-cotizacion { border-left-color: var(--indigo); }
        .card.area-montaje { border-left-color: var(--olive); }

        .card-title { font-size: 14px; line-height: 1.4; margin: 0 0 6px; }
        .card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-soft); }
        .card-notes { font-size: 12px; color: var(--ink-soft); font-style: italic; margin: 8px 0 0; padding-left: 8px; border-left: 2px solid var(--line); }

        .tag { padding: 2px 6px; text-transform: uppercase; letter-spacing: 0.03em; }
        .tag.area-produccion { background: var(--oxide-light); color: var(--oxide); }
        .tag.area-diseno { background: var(--blueprint-light); color: var(--blueprint); }
        .tag.area-gestion { background: var(--plum-light); color: var(--plum); }
        .tag.area-compras { background: var(--amber-light); color: var(--amber); }
        .tag.area-pedidos { background: var(--teal-light); color: var(--teal); }
        .tag.area-cotizacion { background: var(--indigo-light); color: var(--indigo); }
        .tag.area-montaje { background: var(--olive-light); color: var(--olive); }
        .tag.urgent { background: var(--oxide); color: var(--paper); }
        .tag.due { color: var(--ink-soft); }
        .tag.overdue { background: var(--oxide); color: var(--paper); }
        .tag.project-tag { background: var(--steel-light); color: var(--ink-soft); }
        .tag.status-open { background: var(--oxide-light); color: var(--oxide); }
        .tag.status-resolved { background: var(--olive-light); color: var(--olive); }

        .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
        .move-btns { display: flex; gap: 6px; }
        .move-btns button, .del-btn, .edit-btn-sm, .resolve-btn {
            border: 1px solid var(--line); background: none; color: var(--ink-soft);
            font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 3px 7px; cursor: pointer;
        }
        .move-btns button:hover { border-color: var(--blueprint); color: var(--blueprint); }
        .move-btns button:disabled { opacity: 0.25; cursor: default; }
        .del-btn:hover { border-color: var(--oxide); color: var(--oxide); }
        .edit-btn-sm:hover { border-color: var(--blueprint); color: var(--blueprint); }
        .resolve-btn { border-color: var(--olive); color: var(--olive); }
        .resolve-btn:hover { background: var(--olive-light); }
        .card-actions-right { display: flex; gap: 6px; }
        .empty { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--steel); }

        .edit-form { display: flex; flex-direction: column; gap: 6px; }
        .edit-form input, .edit-form select, .edit-form textarea { padding: 7px 8px; border: 1px solid var(--line); font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; }
        .edit-form textarea { resize: vertical; min-height: 44px; }
        .edit-form .row { display: flex; gap: 6px; flex-wrap: wrap; }
        .edit-form .row-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 2px; }
        .edit-form .row-actions button { padding: 6px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); }
        .edit-form .row-actions button.cancel { background: var(--paper); color: var(--ink-soft); border-color: var(--line); }

        .today-list { display: flex; flex-direction: column; gap: 10px; }
        .today-item { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--steel); padding: 12px; }
        .today-item.overdue { border-left-color: var(--oxide); }
        .today-item .top-row { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
        .today-item .title { font-size: 14px; margin: 0 0 6px; }
        .today-item .meta { display: flex; gap: 6px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-soft); }

        .done-btn { border: 1px solid var(--olive); color: var(--olive); background: none; font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
        .done-btn:hover { background: var(--olive-light); }

        .week-group { margin-bottom: 20px; }
        .week-group-head { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; display: flex; gap: 8px; align-items: baseline; }
        .week-group-head .day-count { margin-left: auto; color: var(--steel); }

        .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .cal-head .cal-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; text-transform: capitalize; }
        .cal-head button { border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 5px 10px; cursor: pointer; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 20px; }
        .cal-dow { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; text-transform: uppercase; color: var(--steel); text-align: center; padding-bottom: 4px; }
        .cal-day { background: var(--card); border: 1px solid var(--line); min-height: 56px; padding: 5px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
        .cal-day.empty { background: transparent; border-color: transparent; cursor: default; }
        .cal-day.today { border-color: var(--ink); border-width: 2px; }
        .cal-day.selected { background: var(--steel-light); box-shadow: inset 0 0 0 1px var(--ink); }
        .cal-day.overdue-day { border-color: var(--oxide); }
        .cal-day-num { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }
        .cal-dots { display: flex; gap: 2px; flex-wrap: wrap; }
        .cal-dot { width: 6px; height: 6px; border-radius: 50%; }
        .cal-dot.area-produccion { background: var(--oxide); }
        .cal-dot.area-diseno { background: var(--blueprint); }
        .cal-dot.area-gestion { background: var(--plum); }
        .cal-dot.area-compras { background: var(--amber); }
        .cal-dot.area-pedidos { background: var(--teal); }
        .cal-dot.area-cotizacion { background: var(--indigo); }
        .cal-dot.area-montaje { background: var(--olive); }

        .view-buttons { display: flex; gap: 8px; margin-bottom: 20px; }
        .today-btn { display: flex; align-items: center; gap: 8px; background: var(--ink); color: var(--paper); border: none; padding: 10px 16px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; flex: 1; justify-content: center; }
        .today-btn .count { background: var(--oxide); color: #fff; padding: 1px 7px; font-size: 11px; }
        .today-btn.in-today { background: var(--blueprint); }

        /* ---------- incidents & notes ---------- */
        .incident-card, .note-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 3px solid var(--steel);
            padding: 12px 14px;
            margin-bottom: 10px;
        }
        .incident-card.open { border-left-color: var(--oxide); }
