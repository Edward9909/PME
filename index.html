<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AS — Plataforma operativa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --paper: #F1EDE3;
            --ink: #2B2B28;
            --ink-soft: #5C5A52;
            --blueprint: #2C5F74;
            --blueprint-light: #E4EEF0;
            --oxide: #B5502D;
            --oxide-light: #F7E6DE;
            --olive: #5C6B3E;
            --olive-light: #E8ECDC;
            --plum: #6B4A6B;
            --plum-light: #EFE3EC;
            --amber: #9C7A1F;
            --amber-light: #F5EAD3;
            --teal: #1F7A6C;
            --teal-light: #DCEFEB;
            --indigo: #4C4A8C;
            --indigo-light: #E4E3F2;
            --steel: #6E6B62;
            --steel-light: #EAE8E1;
            --line: #D8D3C4;
            --card: #FFFFFF;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: 'IBM Plex Sans', sans-serif;
            padding: 20px 16px 60px;
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 9px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .head h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 19px;
            margin: 0;
        }

        .head .meta {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--ink-soft);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* ---------- sesión ---------- */
        .session-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
            margin-bottom: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11.5px;
            color: var(--ink-soft);
        }

        .session-bar .session-sep { flex: 1; }

        .session-bar .link-btn {
            border: none;
            background: none;
            color: var(--blueprint);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            padding: 0;
            cursor: pointer;
            text-decoration: underline;
        }

        .session-bar .link-btn:hover { color: var(--ink); }

        .session-bar .role-tag {
            font-size: 10px;
            padding: 2px 7px;
            background: var(--steel-light);
        }

        .session-bar button {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink-soft);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            padding: 5px 10px;
            cursor: pointer;
        }

        .session-bar button:hover { border-color: var(--oxide); color: var(--oxide); }

        /* ---------- login / pendiente ---------- */
        .gate-screen {
            max-width: 420px;
            margin: 60px auto;
            text-align: center;
            background: var(--card);
            border: 1px solid var(--line);
            border-top: 3px solid var(--ink);
            padding: 32px 28px;
        }

        .gate-screen h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 18px;
            margin: 0 0 10px;
        }

        .gate-screen p {
            font-size: 13.5px;
            color: var(--ink-soft);
            line-height: 1.6;
            margin: 0 0 20px;
        }

        .google-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 11px 20px;
            border: 1px solid var(--ink);
            background: var(--ink);
            color: var(--paper);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12.5px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .google-btn:hover { background: var(--blueprint); border-color: var(--blueprint); }

        .pin-input {
            display: block;
            width: 100%;
            max-width: 200px;
            margin: 0 auto 10px;
            padding: 12px;
            text-align: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 20px;
            letter-spacing: 0.35em;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
        }

        .pin-error {
            color: var(--oxide);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            min-height: 14px;
            margin-bottom: 8px;
        }

        .gate-badge {
            display: inline-block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: var(--amber-light);
            color: var(--amber);
            padding: 3px 9px;
            margin-bottom: 14px;
        }

        .gate-badge.err { background: var(--oxide-light); color: var(--oxide); }

        /* ---------- Usuarios (admin) ---------- */
        .user-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 3px solid var(--steel);
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .user-row.pending { border-left-color: var(--amber); }
        .user-row.active { border-left-color: var(--olive); }
        .user-row.revoked { border-left-color: var(--oxide); opacity: 0.75; }

        .user-row .who { flex: 1; min-width: 160px; }
        .user-row .who .name { font-size: 13.5px; margin: 0; }
        .user-row .who .email { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-soft); }

        .user-row select {
            padding: 6px 8px;
            border: 1px solid var(--line);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
        }

        .user-row button {
            border: 1px solid var(--olive);
            color: var(--olive);
            background: none;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            padding: 6px 10px;
            cursor: pointer;
        }

        .user-row button.revoke { border-color: var(--oxide); color: var(--oxide); }
        .user-row button:hover { opacity: 0.7; }

        /* ---------- alert banner ---------- */
        .alert-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--oxide-light);
            border: 1px solid var(--oxide);
            color: var(--oxide);
            padding: 10px 14px;
            margin-bottom: 18px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
        }

        .alert-banner strong { font-weight: 600; }

        .report-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--blueprint-light);
            border: 1px solid var(--blueprint);
            color: var(--blueprint);
            padding: 10px 14px;
            margin-bottom: 18px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        /* ---------- admin tab bar ---------- */
        .tabbar {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border-bottom: 1.5px solid var(--ink);
            padding-bottom: 0;
        }

        .tabbar button {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 9px 14px;
            border: 1px solid var(--line);
            border-bottom: none;
            background: var(--steel-light);
            color: var(--ink-soft);
            cursor: pointer;
            position: relative;
            top: 1.5px;
        }

        .tabbar button.active {
            background: var(--paper);
            color: var(--ink);
            border-color: var(--ink);
            border-bottom: 1.5px solid var(--paper);
        }

        .tab-badge {
            display: inline-block;
            min-width: 16px;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 999px;
            background: var(--oxide);
            color: #fff;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0;
            text-transform: none;
            vertical-align: middle;
        }

        .section-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ink-soft);
            margin: 0 0 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ---------- indicators ---------- */
        .indicator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .indicator-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-top: 3px solid var(--steel);
            padding: 14px;
        }

        .indicator-card.warn { border-top-color: var(--oxide); }
        .indicator-card .num {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 26px;
            line-height: 1;
            margin-bottom: 4px;
        }

        .indicator-card .num.warn-num { color: var(--oxide); }

        .indicator-card .label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            color: var(--ink-soft);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* ---------- dashboard operativo ---------- */
        .dash-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-soft);
            border-bottom: 1px solid var(--ink);
            padding-bottom: 5px;
            margin: 0 0 10px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
        }

        .dash-label .dash-hint { letter-spacing: 0.04em; text-transform: none; color: var(--steel); }

        .next-action {
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 4px solid var(--ink);
            padding: 12px 16px;
            margin-bottom: 26px;
            display: flex;
            align-items: baseline;
            gap: 8px 18px;
            flex-wrap: wrap;
        }

        .next-action.is-overdue { border-left-color: var(--oxide); }
        .next-action .na-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--ink-soft);
            flex: 1 1 100%;
        }
        .next-action .na-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px; }
        .next-action .na-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }
        .next-action .na-when { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--oxide); }
        .next-action button {
            margin-left: auto;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 7px 14px;
            border: 1px solid var(--ink);
            background: var(--ink);
            color: var(--paper);
            cursor: pointer;
        }
        .next-action button:hover { background: var(--blueprint); border-color: var(--blueprint); }

        .action-group { margin-bottom: 14px; }
        .action-group-head {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-soft);
            margin-bottom: 5px;
        }
        .action-group-head b { color: var(--ink); font-weight: 500; }
        .action-group.g-overdue .action-group-head b { color: var(--oxide); }

        .action-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 4px 14px;
            align-items: baseline;
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 3px solid var(--steel);
            padding: 9px 12px;
            margin-bottom: 4px;
        }
        .action-row.r-overdue { border-left-color: var(--oxide); }
        .action-row.r-today { border-left-color: var(--amber); }
        .action-row .ar-title { font-size: 13.5px; }
        .action-row .ar-sub {
            grid-column: 1 / 2;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            color: var(--ink-soft);
        }
        .action-row .ar-when {
            grid-row: 1 / 3;
            grid-column: 2 / 3;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            color: var(--ink-soft);
            white-space: nowrap;
        }
        .action-row.r-overdue .ar-when,
        .action-row.r-urgent .ar-when { color: var(--oxide); }
        .action-row .ar-open {
            grid-row: 1 / 3;
            grid-column: 3 / 4;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            padding: 5px 10px;
            border: 1px solid var(--line);
            background: var(--paper);
            color: var(--ink-soft);
            cursor: pointer;
            white-space: nowrap;
        }
        .action-row .ar-open:hover { border-color: var(--ink); color: var(--ink); }

        .dash-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            margin-bottom: 26px;
            align-items: start;
        }

        /* métricas como contexto, no protagonista */
        .ops-strip {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            border: 1px solid var(--line);
            background: var(--card);
            margin-bottom: 26px;
        }
        .ops-block { padding: 11px 14px; border-right: 1px solid var(--line); }
        .ops-block:last-child { border-right: none; }
        .ops-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9.5px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-soft);
            margin-bottom: 4px;
        }
        .ops-figure { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; }
        .ops-figure .warn-num { color: var(--oxide); }
        .ops-detail { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--steel); margin-top: 3px; }

        /* proyectos: composición editorial, sin barra genérica */
        .proj-row { padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
        .proj-row:hover .proj-name { color: var(--blueprint); }
        .proj-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
        .proj-name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13.5px; }
        .proj-pct { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; }
        .proj-meta { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); margin-top: 3px; }
        .proj-meta .warn-num { color: var(--oxide); }
        .proj-rule { height: 2px; background: var(--line); margin-top: 7px; }
        .proj-rule span { display: block; height: 100%; background: var(--ink); }

        /* carga de los próximos días */
        .tl-day-block { border-bottom: 1px solid var(--line); padding-bottom: 5px; margin-bottom: 5px; }
        .tl-day-head {
            display: flex;
            justify-content: space-between;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ink-soft);
            margin: 0 0 3px;
        }
        .tl-task {
            display: grid;
            grid-template-columns: 9px 1fr auto;
            gap: 8px;
            align-items: baseline;
            padding: 3px 0;
            cursor: pointer;
        }
        .tl-task:hover .tl-task-title { color: var(--blueprint); }
        .tl-task-title { font-size: 12.5px; }
        .tl-task-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--steel); }
        .tl-mark { width: 9px; height: 9px; background: var(--steel); align-self: center; }
        .mark-produccion { background: var(--oxide); }
        .mark-diseno { background: var(--blueprint); }
        .mark-gestion { background: var(--plum); }
        .mark-compras { background: var(--amber); }
        .mark-pedidos { background: var(--teal); }
        .mark-cotizacion { background: var(--indigo); }
        .mark-montaje { background: var(--olive); }

        .act-row {
            display: grid;
            grid-template-columns: 78px 1fr;
            gap: 10px;
            padding: 5px 0;
            border-bottom: 1px dashed var(--line);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
        }
        .act-when { color: var(--steel); text-transform: uppercase; letter-spacing: 0.04em; }
        .act-text { color: var(--ink-soft); }

        .dash-empty {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--steel);
            padding: 10px 0;
        }

        @media (max-width:860px) {
            .dash-cols { grid-template-columns: 1fr; gap: 22px; }
            .action-row { grid-template-columns: 1fr auto; }
            .action-row .ar-open { grid-row: auto; grid-column: 1 / 3; justify-self: start; margin-top: 6px; }
        }

        /* ---------- projects strip / cards (reused) ---------- */
        .projects-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .project-card {
            flex: 0 0 210px;
            background: var(--card);
            border: 1px solid var(--line);
            border-top: 3px solid var(--steel);
            padding: 12px 12px 10px;
            cursor: pointer;
        }

        .project-card.active { border-top-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
        .project-card.general { border-top-color: var(--blueprint); }
        .project-card.overdue { border-top-color: var(--oxide); }
        .project-card.readonly { cursor: default; }

        .project-name {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 13.5px;
            margin: 0 0 4px;
        }

        .project-client { font-size: 11.5px; color: var(--ink-soft); margin: 0 0 8px; }
        .project-deadline { font-family: 'IBM Plex Mono', monospace; font-size: 10px; margin: 0 0 8px; color: var(--ink-soft); }
        .project-deadline.overdue { color: var(--oxide); font-weight: 600; }
        .project-bar-track { height: 4px; background: var(--line); margin-bottom: 6px; }
        .project-bar-fill { height: 100%; background: var(--olive); }
        .project-stats { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); display: flex; justify-content: space-between; margin-bottom: 6px; }
        .project-areas { display: flex; gap: 4px; flex-wrap: wrap; }
        .area-chip { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; padding: 1px 5px; letter-spacing: 0.02em; }

        .new-project-form {
            display: none;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 22px;
            background: var(--card);
            border: 1px solid var(--line);
            padding: 14px;
            align-items: center;
        }

        .new-project-form.show { display: flex; }
        .new-project-form input { padding: 9px 10px; border: 1px solid var(--line); font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; }
        .new-project-form input[name=name] { flex: 2; min-width: 160px; }
        .new-project-form input[name=client] { flex: 1.5; min-width: 140px; }
        .new-project-form label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); display: flex; flex-direction: column; gap: 3px; }
        .new-project-form button { padding: 9px 16px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; cursor: pointer; align-self: flex-end; }
        .new-project-form button.cancel { background: var(--paper); color: var(--ink-soft); border-color: var(--line); }

        .add-project-card {
            flex: 0 0 210px;
            border: 1px dashed var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--ink-soft);
            cursor: pointer;
            background: transparent;
        }

        .add-project-card:hover { border-color: var(--blueprint); color: var(--blueprint); }

        .active-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
        .active-head h2 { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600; margin: 0; }
        .active-head .sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }

        .project-toolbar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
        .project-toolbar button { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; padding: 5px 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); cursor: pointer; }
        .project-toolbar button.finalize { border-color: var(--olive); color: var(--olive); }
        .project-toolbar button.edit-btn { border-color: var(--steel); }
        .project-toolbar button.danger { border-color: var(--oxide-light); color: var(--oxide); margin-left: auto; }
        .project-toolbar button.danger:hover { background: var(--oxide-light); }

        .add-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .add-bar input[type=text] { flex: 2; min-width: 180px; padding: 10px 12px; border: 1px solid var(--line); background: var(--card); font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; }
        .add-bar input[type=date] { padding: 9px 8px; border: 1px solid var(--line); background: var(--card); font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); }
        .add-bar select { padding: 10px 8px; border: 1px solid var(--line); background: var(--card); font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
        .add-bar button { padding: 10px 18px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; cursor: pointer; }
